name: dbt CI/CD

on:
  pull_request:   # CI runs on PRs
    branches: [main]
  push:           # CD runs on merges
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Run dbt debug
        run: dbt debug --target default

      - name: Run dbt models
        run: dbt run --target dev

      - name: Run dbt tests
        run: dbt test --target dev

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dbt
        run: pip install dbt-snowflake
      - name: Deploy to QA
        run: dbt build --target qa
      - name: Deploy to Prod
        if: github.event_name == 'workflow_dispatch'
        run: dbt build --target prod